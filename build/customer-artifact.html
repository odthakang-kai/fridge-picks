/* ---------- link <-> state ---------- */
const STC={f:"FD",s:"SS",b:"BF",t:"TF"};
function decode(h){h=(h||"").replace(/^#/,"");const t=h.split("-");if(t[0]!=="q1")return false;
 st.ids=[];st.habits={};st.sp.na={};st.styles=[];st.est=null;st.bmin=null;st.auto=false;
 for(const x of t.slice(1)){if(/^\d{9}$/.test(x)){if(!st.ids.includes(x))st.ids.push(x);continue}
  const k=x[0],v=x.slice(1);
  const mk=Object.keys(MK).find(m=>MK[m]===k);
  if(mk&&/^\d+$/.test(v))st.sp[mk]=+v/100;
  else if(k==="z")[...v].forEach(c=>{const m=Object.keys(MK).find(m=>MK[m]===c);if(m&&m!=="ow"&&m!=="door")st.sp.na[m]=1});
  else if(k==="p")st.sp.path={s:"straight",t:"turn",x:"stairs"}[v]||"straight";
  else if(k==="r")st.sp.water={y:"yes",n:"no",u:"unsure"}[v]||"unsure";
  else if(k==="a")st.adults=Math.max(1,+v||2);else if(k==="k")st.kids=Math.max(0,+v||0);
  else if(k==="b"&&/^\d+$/.test(v))st.budget=+v;
  else if(k==="f")[...v].forEach(c=>{if(HL[c])st.habits[HL[c][0]]=true});
  else if(k==="n")st.name=v.replace(/[^A-Za-z]/g,"").slice(0,20);
  else if(k==="o")st.floorIdx=[...v].map(Number);
  else if(k==="x"&&/^\d+$/.test(v))st.est=+v/100;
  else if(k==="s")st.styles=[...v].map(c=>STC[c]).filter(Boolean);
  else if(k==="l"&&/^\d+$/.test(v))st.bmin=+v;
  else if(k==="m")st.auto=v==="1";}
 for(const k in st.sp.na)st.sp[k]=null;
 if(st.floorIdx){st.floor=st.floorIdx.map(i=>st.ids[i-1]).filter(Boolean);delete st.floorIdx;}
 st.ids=st.ids.filter(id=>CAT.some(u=>u.id===id)).slice(0,MAXP);st.orig=st.ids.slice();return true;}
function encode(){const t=["q1",...st.ids];for(const k in MK)if(st.sp[k]!=null)t.push(MK[k]+Math.round(st.sp[k]*100));
 const z=Object.keys(st.sp.na).map(k=>MK[k]).join("");if(z)t.push("z"+z);
 t.push("p"+({straight:"s",turn:"t",stairs:"x"}[st.sp.path]||"s"),"r"+({yes:"y",no:"n",unsure:"u"}[st.sp.water]||"u"),"a"+st.adults,"k"+st.kids);
 if(st.budget)t.push("b"+Math.round(st.budget));
 const hb=Object.entries(HL).filter(([,v])=>st.habits[v[0]]).map(([c])=>c).join("");if(hb)t.push("f"+hb);
 const fl=st.ids.map((id,i)=>st.floor.includes(id)?i+1:"").join("");if(fl)t.push("o"+fl);
 if(st.est)t.push("x"+Math.round(st.est*100));
 if(st.styles.length)t.push("s"+st.styles.map(x=>Object.keys(STC).find(c=>STC[c]===x)).join(""));
 if(st.bmin)t.push("l"+Math.round(st.bmin));if(st.auto)t.push("m1");
 if(st.name)t.push("n"+st.name.toLowerCase());return t.join("-");}
function save(){const h="#"+encode();try{history.replaceState(null,"",h)}catch(e){}try{localStorage.setItem("fp_state",h)}catch(e){}}
function sync(){S.adults=st.adults;S.kids=st.kids;S.habits=st.habits;}

/* ---------- shared bits ---------- */
const nm=()=>st.name?st.name[0].toUpperCase()+st.name.slice(1).toLowerCase():"";
const measured=()=>Object.keys(MK).some(k=>st.sp[k]!=null);
const picks=()=>st.ids.map(id=>CAT.find(u=>u.id===id)).filter(Boolean);
const hasIce=u=>u.disp!=="None"&&u.disp!=="Beverage Center"||/ice maker|ice &|dual ice|craft ice|sphere ice/i.test(u.label);

function togglePick(id){st.auto=false;const i=st.ids.indexOf(id);if(i>=0){st.ids.splice(i,1);toast("Removed from your picks")}
 else{if(st.ids.length>=MAXP){toast(`Your list holds ${MAXP}. Remove one first`);return}st.ids.push(id);toast("Added to your picks")}save();render();}
function copyLink(){const url=location.href;

/* ---------- what we checked ---------- */
const COV=[
 {k:"ow",l:"Width of the space",short:"width",req:1},
 {k:"oh",l:"Height of the space",short:"height",req:1,na:"No cabinet above"},
 {k:"door",l:"Doorways on the way in",short:"doorway",req:1},
 {k:"island",l:"Room for the doors to open",short:"door swing",na:"Nothing across from it"},
 {k:"hinge",l:"Wall right beside it",short:"side wall",na:"No wall beside it"},
 {k:"nook",l:"Walls on both sides",short:"nook",na:"Not in a nook"},
 {k:"cab",l:"How far it sticks out",short:"counter line",na:"Skipped"},
 {k:"water",l:"Water line for ice",short:"water line"}];
function covState(c){const sp=st.sp;
 if(c.k==="water")return sp.water==="unsure"?{s:"miss",t:"Not sure yet"}:{s:"done",t:sp.water==="yes"?"Yes, there's one":"No water line"};
 if(c.k==="hinge"&&sp.nook!=null)return {s:"done",t:"Covered by the nook depth"};
 if(sp[c.k]!=null)return {s:"done",t:c.k==="door"?`${inch(sp.door)}, ${({straight:"straight shot",turn:"tight turn",stairs:"stairs"})[sp.path]}`:inch(sp[c.k])};
 if(sp.na[c.k])return {s:"na",t:c.na||"Doesn't apply"};
 return {s:"miss",t:c.req?"Not measured yet":"Not answered yet"};}
function coverage(){const r=COV.map(c=>({...c,...covState(c)}));return {rows:r,done:r.filter(x=>x.s!=="miss").length,miss:r.filter(x=>x.s==="miss")};}
function checkedHTML(){const cv=coverage(),n=needs();
 const ic={done:`<span class="ci done" aria-hidden="true">✓</span>`,na:`<span class="ci na" aria-hidden="true">–</span>`,miss:`<span class="ci miss" aria-hidden="true"></span>`};
 return `<section class="panel checked"><div class="chead"><p class="eyebrow">What we checked</p><span class="cnt">${cv.done} of ${cv.rows.length} covered</span></div>
  <ul class="clist">${cv.rows.map(r=>`<li class="${r.s}">${ic[r.s]}<span class="cl">${r.l}</span><span class="cv">${r.s==="miss"?`<button class="linkbtn" data-go="measure" data-focus="${r.k}">${r.t}</button>`:r.t}</span></li>`).join("")}</ul>
  <p class="note">Sized for ${n.people} ${n.people===1?"person":"people"}: ${n.lo}–${n.hi} cu ft${st.budget&&st.bmin?` · ${fmt(st.bmin)} to ${fmt(st.budget)}`:st.budget?` · under ${fmt(st.budget)}`:st.bmin?` · ${fmt(st.bmin)} and up`:""}. ${cv.miss.length?"Anything not covered isn't part of the fit check yet.":"Everything that matters for fit is covered."}</p>
  <button class="btn ghost sm" data-go="measure">${cv.miss.length?"Finish measuring":"Change measurements"}</button></section>`;}
function checkedWords(){const cv=coverage(),done=cv.rows.filter(r=>r.s==="done"&&r.k!=="water"&&!(r.k==="hinge"&&st.sp.nook!=null)).map(r=>r.short),miss=cv.rows.filter(r=>r.s==="miss"&&r.k!=="water"&&r.k!=="cab").map(r=>r.short);
 return {done,miss};}

/* ---------- PICKS ---------- */
function verdictBox(u,f){const k=fitKey(f),cw=checkedWords();
 if(k==="na")return `<div class="verdict na"><span class="ic" aria-hidden="true">?</span><span><b>Not checked yet</b>${st.auto?"Measure your space and we'll check these and re-rank them for you.":"Measure your space and we'll check it for you."}${st.est?` <small>You're replacing about a ${inch(st.est)} wide fridge. That's a starting point, not a measurement.</small>`:""}</span></div>`;
 const items=f.checks.filter(c=>c.s!=="ok"&&!(c.k==="Water"&&!hasIce(u)));
 const head={ok:["✓","Fits your kitchen"],chk:["✓",items.length>1?`Fits, ${items.length} things to check`:"Fits, 1 thing to check"],tight:["!","Tight, double check"],no:["✕","Won't fit as measured"]}[k];
 const cls={ok:"ok",chk:"ok",tight:"chk",no:"no"}[k];
 return `<div class="verdict ${cls}"><span class="ic" aria-hidden="true">${head[0]}</span><span><b>${head[1]}</b>
  ${items.length?`<ul class="vlist">${items.slice(0,3).map(c=>`<li>${c.t}</li>`).join("")}</ul>`:""}
  <small>Checked: ${cw.done.join(", ")||"nothing yet"}${cw.miss.length?`. Not checked yet: ${cw.miss.join(", ")}`:""}.</small></span></div>`;}
function extrasList(u,sp){const g=[];
 if(hasIce(u)&&sp.water!=="yes"&&!(sp.water==="no"))g.push("Needs a water line behind it for ice and water");
 if(hasIce(u)&&S.habits.reliable)g.push("Ice makers are the most common repair. Ask us about the protection plan");
 if(!u.returnable)g.push("No change-of-mind returns. Problems are covered for 2 days after delivery");
 if(u.av==="O")g.push("Online only, so it ships to your home and isn't in the store");
 return g;}
function cardHTML(u,i,us,sp){const f=fit(u,sp),p=promo(u),why=whyList(u,us),ex=extrasList(u,sp);
 return `<article class="pick">
  <div class="top">${miniSil(u)}<div><div class="num">Option ${i+1}${us.length>1?` of ${us.length}`:""}</div><div class="brand">${u.brand}</div><h2>${shortLabel(u)}</h2><div class="model">Model ${u.model}</div></div></div>
  ${verdictBox(u,f)}
  ${st.floor.includes(u.id)?`<div class="floor">On display in store. Come see it in person.</div>`:""}
  <div class="pricebox"><div><small>Price on ${dShort()}</small>${priceHTML(u.price)}${p&&p.save?`<div class="eff">${fmt(p.eff)} with the current promotion</div>`:""}</div>
   <a class="btn ghost" href="https://www.homedepot.com/p/${u.id}" rel="noopener">See today's price</a></div>
  <ul class="facts"><li><small>Inside</small>${u.cap} cu ft</li><li><small>Room for</small>${people(u)}</li><li><small>Style</small>${STYLE[u.type]}${u.counter?", counter depth":""}</li><li><small>Owners rate it</small>${u.reviews?`★ ${u.rating.toFixed(1)} (${u.reviews.toLocaleString()})`:"No reviews yet"}</li></ul>
  <div><h3>Why this one</h3><ul class="why">${(why.slice(0,3).map(x=>`<li>${x}</li>`).join(""))||"<li>Solid all-around pick in your size</li>"}</ul></div>
  <details class="more"><summary>More details</summary><div class="morein">
   <ul class="facts"><li><small>Size (W × H × D)</small>${inch(u.w)} × ${inch(u.h)} × ${inch(u.d)}</li><li><small>Doors open</small>${u.d90?inch(u.d90)+" from the back":"–"}</li><li><small>Ice & water</small>${u.disp==="None"?"None in the door":u.disp==="Both"?"Ice and water":u.disp}</li><li><small>Returns</small>${u.returnable?"90 days":"Problems only, 2 days"}</li></ul>
   ${why.length>3?`<ul class="why">${why.slice(3).map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
   ${ex.length?`<div><h3>Good to know</h3><ul class="gtk">${ex.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
   ${(sp.ow||sp.island||sp.hinge!=null||sp.nook!=null)?`<div class="drawings"><div class="drawing"><span class="cap">Front · in your space</span>${frontDrawing(u,sp)}${frontLegend(u,sp)}</div><div class="drawing"><span class="cap">From above · doors open</span>${planDrawing(u,sp)}${planLegend(u,sp)}</div></div>`:""}
   <button class="linkbtn" data-rm="${u.id}" style="align-self:flex-start">Remove from my picks</button></div></details>
 </article>`;}
function compareHTML(us,sp){const R=(label,fn,best)=>{let bi=-1;if(best){const v=us.map(best),t=Math.min(...v);if(isFinite(t)&&v.filter(x=>x===t).length===1)bi=v.indexOf(t)}return `<tr><th scope="row">${label}</th>${us.map((u,i)=>`<td class="${i===bi?"best":""}">${fn(u)}</td>`).join("")}</tr>`};
 return `<section class="panel"><div class="tablewrap"><table><thead><tr><th scope="row"></th>${us.map((u,i)=>`<th>Option ${i+1}<div class="model">${u.brand}</div></th>`).join("")}</tr></thead><tbody>
  ${R("Fit",u=>fitTag(fit(u,sp)))}
  ${R("Price",u=>fmt(u.price),u=>u.price??Infinity)}${us.some(u=>promo(u)&&promo(u).save)?R("With promotion",u=>{const p=promo(u);return p&&p.save?fmt(p.eff):"–"},u=>effPrice(u)):""}
  ${R("Inside",u=>u.cap+" cu ft",u=>-u.cap)}${R("$ per cu ft",u=>"$"+Math.round(effPrice(u)/u.cap),u=>effPrice(u)/u.cap)}
  ${R("Width",u=>inch(u.w),null)}${R("Doors open",u=>u.d90?inch(u.d90)+" from back":"–",u=>u.d90||99)}${R("Ice & water",u=>u.disp==="None"?"None":u.disp==="Both"?"Ice + water":u.disp)}
  ${R("Rating",u=>u.reviews?`★ ${u.rating.toFixed(1)} (${u.reviews.toLocaleString()})`:"–",u=>-BAYES(u))}${R("Returns",u=>u.returnable?"90 days":"Problems only, 2 days")}${R("In the store",u=>st.floor.includes(u.id)?"On display":u.av==="O"?"Online only":"Order in store")}</tbody></table></div>
  <p class="note">Green marks the best in each row.</p></section>`;}
function beforeBuy(us,sp){const L=[],cov=coverage();
 cov.miss.forEach(r=>{if(r.k==="water"){if(us.some(hasIce))L.push(`Check for a water line behind your current fridge. Ice and water in the door need one`);return}
  if(r.k==="cab")return;L.push(`<button class="linkbtn" data-go="measure" data-focus="${r.k}">${r.req?"Measure":"Answer"}: ${r.l.toLowerCase()}</button>`);});
 us.forEach((u,i)=>{const f=fit(u,sp);f.checks.filter(c=>c.s!=="ok"&&c.k!=="Water").forEach(c=>L.push(`Option ${i+1} (${u.brand}): ${c.t}`));});
 L.push("Clear a path from the front door to the kitchen for delivery day");
 L.push("Ask about haul-away for your old fridge when you order");
 return `<section class="panel"><p class="eyebrow">Before you buy</p><ul class="todo">${[...new Set(L)].map(x=>`<li>${x}</li>`).join("")}</ul></section>`;}
function renderPicks(){const us=picks(),sp=st.sp;
 if(!us.length)return `<div class="empty"><b>No fridges on your list yet.</b><span>${measured()?"Your measurements are saved. See which fridges fit.":"Start by measuring your space, then pick up to 3 fridges that fit."}</span><div class="row" style="justify-content:center">${measured()?"":`<button class="btn" data-go="measure">Measure my kitchen</button>`}<button class="btn ${measured()?"":"ghost"}" data-go="find">Find fridges</button></div></div>`+ctaHTML();
 let html=checkedHTML();
 if(st.auto&&measured())html+=`<p class="note">Re-ranked for the measurements you entered. Add or remove a fridge and your list stays put.</p>`;

 if(us.length>1&&cv==="compare")html+=compareHTML(us,sp);
 else{if(us.length>1)html+=`<div class="pickbar" role="tablist" aria-label="Your picks">${us.map((u,i)=>`<button role="tab" data-pj="${i}" aria-selected="${i===0}"><b>${i+1}</b><span>${u.brand.length>12?u.brand.split(" ")[0]:u.brand}</span></button>`).join("")}</div>`;
  html+=`<div class="pickrail${us.length===1?" one":""}" id="pickrail">${us.map((u,i)=>cardHTML(u,i,us,sp)).join("")}</div>`;}
 html+=`<p class="disc">The fit check is a guide based on the measurements entered. Confirm with the model's installation guide before buying.</p>`;
 if(us.length<MAXP)html+=`<button class="btn ghost" data-go="find">Add another fridge to compare</button>`;
 return html+beforeBuy(us,sp)+ctaHTML()+glossHTML();}
function ctaHTML(){return `<section class="cta"><b>Ready to buy, or have questions?</b><p>Come back and ask for ${nm()||"the appliance team"} in Appliances at ${STORE}. Show this page and we'll pick up where you left off. Your list and measurements are saved on this phone and in this page's link.</p><div class="row"><button class="btn ghost" id="copyLink">Copy my link</button></div></section>`;}

function mfieldHTML(k){const sp=st.sp,[l,h,ph]=MF[k];
 return `<div class="mfield" id="mf-${k}"><figure>${DIA[k]}<figcaption>${VIEW[k]}</figcaption></figure><div class="mbody"><label>${l}<input class="meas" id="m-${k}" data-k="${k}" inputmode="decimal" autocomplete="off" placeholder="${ph}" value="${sp[k]!=null?showIn(sp[k]):""}"></label><p>${h}</p>
  ${k==="oh"?`<button class="linkbtn" data-na="oh">${sp.na.oh?"✓ No cabinet above (tap to undo)":"No cabinet above? Tap here"}</button>`:""}</div></div>`;}
function qHTML([k,q]){const sp=st.sp,yes=st.yes[k]||sp[k]!=null,no=!!sp.na[k];
 if(k==="hinge"&&(sp.nook!=null||st.yes.nook))return "";
 return `<div class="q"><p class="qt">${q}</p><div class="yn" role="group" aria-label="${q}"><button data-yn="${k}" data-v="y" aria-pressed="${yes}">Yes</button><button data-yn="${k}" data-v="n" aria-pressed="${no}">No</button></div>${yes?mfieldHTML(k):""}</div>`;}
function measureStatus(){const us=picks(),cv=coverage(),left=cv.miss.length;
 if(!us.length)return `${left?`${left} left to answer`:"All set"} · <button class="linkbtn" data-go="find">See fridges that fit</button>`;
 if(!measured())return `<b>${us.length} pick${us.length>1?"s":""} not checked yet</b> · ${left} left to answer`;
 const ok=us.filter(u=>fit(u,st.sp).verdict!=="no").length;
 return `<b>${ok} of ${us.length} pick${us.length>1?"s":""} fit so far</b> · ${left?`${left} left to answer`:"all covered"}`;}
function renderMeasure(){const sp=st.sp;
 return `<section class="panel"><h2 class="sec">Measure your kitchen</h2><p class="lede">About 5 minutes with a tape measure. Everything saves as you type. Fractions work: type 35 3/4 or tap a fraction.</p>
  <div class="tipbox"><b>Measure the space, not your old fridge.</b>Your new fridge has to fit the opening, get through the doorways, and have room for its doors to open.</div>
  ${st.est?`<p class="note">In the store we guessed about ${inch(st.est)} wide from the fridge you have now. Measure to be sure; the space can be a little wider.</p>`:""}
  ${st.auto&&st.ids.length?`<p class="note">Your ${st.ids.length} picks aren't checked yet. Once you measure, we'll re-rank them for your space.</p>`:""}</section>
 <section class="panel"><p class="eyebrow">Step 1 · Always measure</p>${["ow","oh","door"].map(mfieldHTML).join("")}
  <div class="mfield"><div></div><div class="mbody"><label>Getting it inside<select id="m-path"><option value="straight"${sp.path==="straight"?" selected":""}>Straight shot to the kitchen</option><option value="turn"${sp.path==="turn"?" selected":""}>Tight turn on the way</option><option value="stairs"${sp.path==="stairs"?" selected":""}>Stairs on the way</option></select></label></div></div></section>
 <section class="panel"><p class="eyebrow">Step 2 · Only if it applies</p><p class="lede">Answer each one. "No" counts too, so we know it's covered.</p>
  ${QS.map(qHTML).join("")}
  <div class="q"><p class="qt">Is there a water line behind your current fridge?</p><div class="yn three" role="group" aria-label="Water line"><button data-water="yes" aria-pressed="${sp.water==="yes"}">Yes</button><button data-water="no" aria-pressed="${sp.water==="no"}">No</button><button data-water="unsure" aria-pressed="${sp.water==="unsure"}">Not sure</button></div><p class="hint">Look behind it for a thin tube going into the wall. You need one for ice and water in the door.</p></div></section>
 <section class="panel"><p class="eyebrow">Step 3 · Your household</p>
  <div class="hh"><div>Adults<div class="stepper"><button data-step="adults" data-d="-1" aria-label="Fewer adults">−</button><output>${st.adults}</output><button data-step="adults" data-d="1" aria-label="More adults">+</button></div></div>
   <div>Kids<div class="stepper"><button data-step="kids" data-d="-1" aria-label="Fewer kids">−</button><output>${st.kids}</output><button data-step="kids" data-d="1" aria-label="More kids">+</button></div></div>
   <div><label for="m-budget" style="font-weight:700">Budget</label><input class="sel" id="m-budget" inputmode="numeric" placeholder="No limit" value="${st.budget??""}"></div></div>
  <div class="chips">${Object.values(HL).map(([k,l])=>`<button class="chip" data-hab="${k}" aria-pressed="${!!st.habits[k]}">${l}</button>`).join("")}</div>
  <p class="note" id="sizeNote">Right size for you: ${needs().lo}–${needs().hi} cu ft</p></section>
 <div class="mstatus" id="mstatus" aria-live="polite">${measureStatus()}</div>
 <div class="row"><button class="btn" data-go="${st.ids.length?"picks":"find"}">${st.ids.length?"Check my picks":"See fridges that fit"}</button>${st.ids.length?`<button class="btn ghost" data-go="find">Find more that fit</button>`:""}</div>
 <div class="fracs" id="fracbar" hidden>${["⅛","¼","⅜","½","⅝","¾","⅞"].map((f,i)=>`<button data-frac="${(i+1)/8}" aria-label="Add ${f}">${f}</button>`).join("")}</div>`;}
function rerenderMeasure(){const y=scrollY;render();scrollTo(0,y);}
function updStatus(){const el=$("mstatus");if(el){el.innerHTML=measureStatus();el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));}}
function bindMeasure(){let last=null;const fb=$("fracbar");
 document.querySelectorAll(".meas").forEach(i=>{i.addEventListener("focus",()=>{last=i;i.closest(".mbody").querySelector("label").after(fb);fb.hidden=false;});
  i.addEventListener("input",()=>{const k=i.dataset.k,v=parseIn(i.value);st.sp[k]=v;if(v!=null)delete st.sp.na[k];save();updStatus();});
  i.addEventListener("blur",()=>{const v=parseIn(i.value);if(v!=null)i.value=showIn(v);setTimeout(()=>{if(!document.activeElement||!document.activeElement.classList.contains("meas"))fb.hidden=true},150);});});
 fb.querySelectorAll("button").forEach(b=>{b.addEventListener("mousedown",e=>e.preventDefault());b.onclick=()=>{const i=last;if(!i)return;const base=Math.floor(parseIn(i.value)||0);const v=base+ +b.dataset.frac;i.value=showIn(v);st.sp[i.dataset.k]=v;delete st.sp.na[i.dataset.k];save();updStatus();i.focus();};});
 document.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>{const k=b.dataset.yn;
  if(b.dataset.v==="y"){st.yes[k]=1;delete st.sp.na[k];}else{delete st.yes[k];st.sp.na[k]=1;st.sp[k]=null;}
  if(k==="nook"&&b.dataset.v==="y"){st.sp.hinge=null;delete st.sp.na.hinge;delete st.yes.hinge;}
  save();rerenderMeasure();if(b.dataset.v==="y"){const i=$("m-"+k);if(i)i.focus({preventScroll:false});}});
 document.querySelectorAll("[data-na]").forEach(b=>b.onclick=()=>{const k=b.dataset.na;if(st.sp.na[k])delete st.sp.na[k];else{st.sp.na[k]=1;st.sp[k]=null;}save();rerenderMeasure();});
 document.querySelectorAll("[data-water]").forEach(b=>b.onclick=()=>{st.sp.water=b.dataset.water;save();rerenderMeasure();});
 $("m-path").onchange=e=>{st.sp.path=e.target.value;save();updStatus();};
 $("m-budget").oninput=e=>{const v=parseFloat(String(e.target.value).replace(/[^\d.]/g,""));st.budget=isFinite(v)&&v>0?v:null;save();};
 document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const k=b.dataset.step;st[k]=Math.max(k==="adults"?1:0,Math.min(12,st[k]+ +b.dataset.d));b.parentElement.querySelector("output").textContent=st[k];sync();save();updMeasureNote();});
 document.querySelectorAll("[data-hab]").forEach(c=>c.onclick=()=>{const k=c.dataset.hab;st.habits[k]=!st.habits[k];if(!st.habits[k])delete st.habits[k];c.setAttribute("aria-pressed",!!st.habits[k]);sync();save();updMeasureNote();});}
function updMeasureNote(){const n=needs(),el=$("sizeNote");if(el)el.textContent=`Right size for you: ${n.lo}–${n.hi} cu ft`;updStatus();}

/* ---------- FIND ---------- */
function score(u,f){return scoreCore(u,f,{n:needs(),habits:st.habits,b:st.budget,bmin:st.bmin||null,ow:st.sp.ow,styles:st.styles&&st.styles.length?st.styles:null,floor:st.floor.includes(u.id)});}
const byScore=(a,b)=>{const d=score(b.u,b.f)-score(a.u,a.f);return Math.abs(d)>1e-9?d:tieBreak(a.u,b.u)};
function results(){const n=needs(),sp=st.sp,max=parseFloat(F.max)||st.budget||null;
 let r=CAT.map(u=>({u,f:fit(u,sp)}));
 if(F.fits&&measured())r=r.filter(x=>x.f.verdict!=="no");
 if(F.size)r=r.filter(x=>x.u.cap>=n.lo-1&&x.u.cap<=n.hi+6);
 if(F.style!=="all")r=r.filter(x=>x.u.type===F.style);
 if(F.ice)r=r.filter(x=>x.u.disp!=="None");if(F.counter)r=r.filter(x=>x.u.counter);if(st.habits.garage)r=r.filter(x=>x.u.garage);
 if(F.brand)r=r.filter(x=>x.u.brand===F.brand);if(max)r=r.filter(x=>x.u.price!=null&&effPrice(x.u)<=max);
 const P=u=>u.price==null?Infinity:effPrice(u);
 if(F.sort==="price")r.sort((a,b)=>P(a.u)-P(b.u));else if(F.sort==="cap")r.sort((a,b)=>b.u.cap-a.u.cap);else if(F.sort==="rated")r.sort((a,b)=>BAYES(b.u)-BAYES(a.u));else r.sort(byScore);
 const groups=new Map();for(const x of r){const k=gkey(x.u);if(groups.has(k))groups.get(k).alts.push(x.u);else groups.set(k,{...x,alts:[]});}
 return [...groups.values()];}
const gkey=u=>[u.brand,u.type,u.cap,u.w,u.price].join("|");
const COLORS=[[/black stainless|black stai\b|black ss\b/i,"Black stainless"],[/matte black/i,"Matte black"],[/matte white/i,"Matte white"],[/white glass/i,"White glass"],[/black glass/i,"Black glass"],[/glass/i,"Glass"],[/panel[- ]ready/i,"Panel ready"],[/slate/i,"Slate"],[/bisque/i,"Bisque"],[/stainless (steel )?look|stainless-look/i,"Stainless look"],[/stainless|\bstai/i,"Stainless"],[/\bwhite\b/i,"White"],[/\bblack\b/i,"Black"],[/navy|blue/i,"Blue"],[/champagne|bronze|gold|brass/i,"Accent trim"]];
const finish=u=>{for(const [re,n] of COLORS)if(re.test(u.label))return n;return "Model "+u.model};
const FIN={};
function hiddenBySize(){if(!F.size)return 0;F.size=false;const n=results().length;F.size=true;return n-results().length;}
function activeFilters(){let n=0;if(F.ice)n++;if(F.counter)n++;if(F.brand)n++;if(F.max)n++;if(F.sort!=="best")n++;if(!F.size)n++;if(measured()&&!F.fits)n++;return n;}
function renderFind(){const n=needs(),r=results(),brands=[...new Set(CAT.map(u=>u.brand).filter(Boolean))].sort(),af=activeFilters();
 const chip=(k,v,l)=>`<button class="chip" data-f="${k}" data-v="${v}" aria-pressed="${F[k]===v}">${l}</button>`;
 return `<section class="panel"><h2 class="sec">Find fridges that fit</h2><p class="lede">${measured()?"Showing fridges that fit the measurements you entered.":"You haven't measured yet, so fit isn't checked. <button class=\"linkbtn\" data-go=\"measure\">Measure first</button>"} Sized for ${n.people} ${n.people===1?"person":"people"} (${n.lo}–${n.hi} cu ft).</p>
  <div class="frow">${chip("style","all","All styles")}${chip("style","FD","French door")}${chip("style","SS","Side by side")}${chip("style","BF","Bottom freezer")}${chip("style","TF","Top freezer")}</div>
  <button class="btn ghost sm" id="filtBtn" aria-expanded="${filtOpen}">${filtOpen?"Hide filters":"Filters and sort"}${af?` (${af})`:""}</button>
  ${filtOpen?`<div class="filters">
   <div class="chips"><button class="chip" data-tg="fits" aria-pressed="${F.fits&&measured()}" ${measured()?"":"disabled"}>Fits my space</button><button class="chip" data-tg="size" aria-pressed="${F.size}">Right size for us</button><button class="chip" data-tg="ice" aria-pressed="${F.ice}">Ice & water in door</button><button class="chip" data-tg="counter" aria-pressed="${F.counter}">Counter depth</button></div>
   <div class="fgrid"><label>Brand<select class="sel" id="f-brand"><option value="">Any brand</option>${brands.map(b=>`<option${F.brand===b?" selected":""}>${b}</option>`).join("")}</select></label>
    <label>Max price<input class="sel" id="f-max" inputmode="numeric" placeholder="${st.budget?fmt(st.budget):"No limit"}" value="${F.max}"></label>
    <label style="grid-column:1/-1">Sort by<select class="sel" id="f-sort"><option value="best"${F.sort==="best"?" selected":""}>Best match for us</option><option value="price"${F.sort==="price"?" selected":""}>Lowest price</option><option value="cap"${F.sort==="cap"?" selected":""}>Most space</option><option value="rated"${F.sort==="rated"?" selected":""}>Top rated</option></select></label></div></div>`:""}
  <p class="disc">Prices come from homedepot.com and update every Sunday. The fit check is a guide; confirm with the model's installation guide before buying.</p></section>
  <p class="note" aria-live="polite">${r.length} fridge${r.length===1?"":"s"} · ${st.ids.length} of ${MAXP} on your list · prices as of ${dShort()}${(()=>{const h=hiddenBySize();return h?` · <button class="linkbtn" data-tg="size">Show ${h} more outside your size range</button>`:""})()}</p>
  <div class="list">${r.length?r.slice(0,lim).map(({u:u0,f:f0,alts})=>{const all=[u0,...alts],gk=gkey(u0),u=all.find(x=>x.id===FIN[gk])||all.find(x=>st.ids.includes(x.id))||u0,f=u===u0?f0:fit(u,st.sp),p=promo(u),on=st.ids.includes(u.id);
   return `<article class="item">${miniSil(u)}<div class="meta"><div class="brand">${u.brand}</div><p class="ttl">${shortLabel(u)}</p>
    <div class="row" style="gap:8px">${priceHTML(u.price)}${p&&p.save?`<span class="eff" style="margin:0">${fmt(p.eff)} with promo</span>`:""}</div>
    <div class="sub">${u.cap} cu ft · ${inch(u.w)} wide · ${STYLE[u.type]}${u.reviews?` · ★ ${u.rating.toFixed(1)} (${u.reviews.toLocaleString()})`:""}</div>
    <div class="tags">${measured()?fitTag(f):""}${u.disp!=="None"?`<span class="tag">${u.disp==="Both"?"Ice + water":u.disp}</span>`:""}${u.zero?`<span class="tag">Zero clearance</span>`:""}${u.av==="O"?`<span class="tag">Online only</span>`:""}</div>
    ${alts.length?`<div class="fins" role="group" aria-label="Color"><span>Color:</span>${all.map(x=>{const nm=finish(x),dup=all.filter(y=>finish(y)===nm).length>1;return `<button class="fin" data-fin="${x.id}" data-gk="${gk}" aria-pressed="${x.id===u.id}">${dup?nm+" · "+x.model:nm}</button>`}).join("")}</div>`:""}
    <div class="acts"><button class="add ${on?"on":""}" data-pick="${u.id}">${on?"✓ On my list":"Add to my list"}</button><a class="linkbtn" href="https://www.homedepot.com/p/${u.id}" rel="noopener">Today's price</a></div></div></article>`}).join("")+(r.length>lim?`<button class="btn ghost" id="more">Show more (${r.length-lim} left)</button>`:""):`<div class="empty">Nothing matches. Turn off a filter${measured()?", or double-check your measurements":""}.</div>`}</div>`;}
function bindFind(){document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F[b.dataset.f]=b.dataset.v;lim=20;render();});
 document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{F[b.dataset.tg]=!F[b.dataset.tg];lim=20;const y=scrollY;render();scrollTo(0,y);});
 $("filtBtn").onclick=()=>{filtOpen=!filtOpen;const y=scrollY;render();scrollTo(0,y);};
 if($("f-brand")){$("f-brand").onchange=e=>{F.brand=e.target.value;lim=20;render();};$("f-sort").onchange=e=>{F.sort=e.target.value;render();};
  $("f-max").onchange=e=>{F.max=String(e.target.value).replace(/[^\d.]/g,"");lim=20;render();};}
 document.querySelectorAll("[data-fin]").forEach(b=>b.onclick=()=>{FIN[b.dataset.gk]=b.dataset.fin;const y=scrollY;render();scrollTo(0,y);});
 if($("more"))$("more").onclick=()=>{lim+=20;const y=scrollY;render();scrollTo(0,y);};}

/* ---------- re-rank picks from a "send home to measure" link once they measure ---------- */
function rerank(){if(!st.auto||!measured())return;const n=needs(),sp=st.sp,max=st.budget;
 let r=CAT.filter(u=>u.price!=null).map(u=>({u,f:fit(u,sp)})).filter(x=>x.f.verdict!=="no"&&x.u.cap>=n.lo-1&&x.u.cap<=n.hi+6&&(!max||effPrice(x.u)<=max));
 if(st.habits.garage)r=r.filter(x=>x.u.garage);if(st.styles.length&&r.filter(x=>st.styles.includes(x.u.type)).length>=3)r=r.filter(x=>st.styles.includes(x.u.type));
 const roomy=r.filter(x=>fitKey(x.f)!=="tight");if(roomy.length>=3)r=roomy;
 const sc=x=>score(x.u,x.f)+(st.orig.includes(x.u.id)?2:0);r.sort((a,b)=>(sc(b)-sc(a))||tieBreak(a.u,b.u));
 const seen=new Set(),out=[];for(const x of r){const k=[x.u.brand,x.u.type,Math.round(x.u.cap),Math.round(x.u.w)].join("|");if(seen.has(k))continue;seen.add(k);out.push(x.u.id);if(out.length===MAXP)break;}
 if(out.length&&out.join()!==st.ids.join()){st.ids=out;st.floor=st.floor.filter(id=>out.includes(id));save();}}

/* ---------- shell ---------- */
function render(){sync();if(tab==="picks")rerank();const n=st.ids.length;$("pickCt").hidden=!n;$("pickCt").textContent=n;
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
 $("by").textContent=`${nm()?`Prepared with ${nm()}, appliance associate`:"Your fridge planner"} · prices as of ${DATA_DATE.toLocaleDateString("en-US",{month:"long",day:"numeric"})}`;
 $("h1").textContent=tab==="measure"?"Measure your kitchen":tab==="find"?"Find more fridges":n?`Your ${n} fridge pick${n>1?"s":""}`:"Your fridge plan";
 $("main").innerHTML=tab==="measure"?renderMeasure():tab==="find"?renderFind():renderPicks();
 if(tab==="measure")bindMeasure();if(tab==="find")bindFind();
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const f=b.dataset.focus;go(b.dataset.go);if(f)focusField(f);});
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>togglePick(b.dataset.rm));
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const y=scrollY;togglePick(b.dataset.pick);scrollTo(0,y);});
 document.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{cv=b.dataset.cv;const y=scrollY;render();scrollTo(0,y);});
 if($("copyLink"))$("copyLink").onclick=copyLink;
 const rail=$("pickrail");if(rail&&document.querySelector(".pickbar")){const bs=[...document.querySelectorAll("[data-pj]")];
  const cur=()=>{const cards=[...rail.children];let best=0,dist=1e9;cards.forEach((c,i)=>{const d=Math.abs(c.offsetLeft-rail.offsetLeft-rail.scrollLeft-parseFloat(getComputedStyle(rail).paddingLeft));if(d<dist){dist=d;best=i}});return best};
  rail.addEventListener("scroll",()=>{const i=cur();bs.forEach((b,j)=>b.setAttribute("aria-selected",j===i))},{passive:true});
  bs.forEach(b=>b.onclick=()=>{const c=rail.children[+b.dataset.pj];if(getComputedStyle(rail).display==="grid"){c.scrollIntoView({behavior:"smooth",block:"start"});return}
   rail.scrollTo({left:c.offsetLeft-rail.offsetLeft-parseFloat(getComputedStyle(rail).paddingLeft),behavior:"smooth"});bs.forEach(x=>x.setAttribute("aria-selected",x===b));});}}
function focusField(k){if(k==="water"){const q=document.querySelector("[data-water]");if(q)q.closest(".q").scrollIntoView({block:"center"});return}
 if(["island","hinge","nook","cab"].includes(k)&&st.sp[k]==null&&!st.yes[k]){const q=document.querySelector(`[data-yn="${k}"]`);if(q){q.closest(".q").scrollIntoView({block:"center"});q.closest(".q").classList.add("flash");}return}
 const i=$("m-"+k);if(i){i.scrollIntoView({block:"center"});i.focus({preventScroll:true});}}
function go(t){tab=t;render();scrollTo(0,0);}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function boot(){let ok=decode(location.hash);if(!ok){try{const h=localStorage.getItem("fp_state");if(h)ok=decode(h)}catch(e){}}
 tab=st.auto&&!measured()?"measure":st.ids.length?"picks":"measure";save();render();}
window.addEventListener("hashchange",()=>{if(location.hash!=="#"+encode()){decode(location.hash);tab=st.ids.length?"picks":tab;render();}});
boot();
</script>
