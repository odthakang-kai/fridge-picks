<title>Your Fridge Shortlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a shopper's take-home fridge planner. Orange header with who helped them, sticky three-tab bar (Your picks, Measure, Find more), one column of cards. Picks show fit, to-scale drawings, reasons and today's-price links; Measure walks through each measurement with a small diagram; Find more browses the full catalog against their kitchen. */
:root{
  --paper:#F5F5F5; --card:#FFFFFF; --sunk:#EEEEEE; --ink:#333333; --muted:#666666; --line:#D9D9D9;
  --band:#F96302; --band-ink:#FFFFFF; --signal:#F96302; --signal-ink:#FFFFFF; --signal-soft:#FEEBDF;
  --blue:#3E7697; --blue-soft:#E4EFF5;
  --good:#00873C; --good-bg:#E2F3E8; --warn:#A35200; --warn-bg:#FDF0E3; --bad:#C8102E; --bad-bg:#FBE3E6;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121212; --card:#1E1E1E; --sunk:#2A2A2A; --ink:#EDEDED; --muted:#A6A6A6; --line:#363636; --band:#E35A00;
  --signal-soft:#3A2414; --blue:#8DBAD6; --blue-soft:#1C2A33;
  --good:#4CC27F; --good-bg:#12291C; --warn:#F2A45A; --warn-bg:#2E200F; --bad:#FF7A85; --bad-bg:#3A161B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121212; --card:#1E1E1E; --sunk:#2A2A2A; --ink:#EDEDED; --muted:#A6A6A6; --line:#363636; --band:#E35A00;
  --signal-soft:#3A2414; --blue:#8DBAD6; --blue-soft:#1C2A33;
  --good:#4CC27F; --good-bg:#12291C; --warn:#F2A45A; --warn-bg:#2E200F; --bad:#FF7A85; --bad-bg:#3A161B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,select{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.gut{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--band);color:var(--band-ink)}
header .gut{padding-block:20px 16px;display:flex;flex-direction:column;gap:6px}
header .kick{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
header h1{margin:0;font-size:26px;line-height:1.12;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;font-size:14.5px;opacity:.95}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs .gut{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:13px 4px 11px;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
nav.tabs .ct{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--signal);color:var(--signal-ink);font-size:12px;margin-left:4px}
main{padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
h2.sec{margin:0;font-size:21px;font-weight:800;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;padding:4px 8px;border-radius:4px;background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums}
.tag.fit{background:var(--good-bg);color:var(--good)}.tag.chk{background:var(--warn-bg);color:var(--warn)}.tag.no{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--signal);color:var(--signal-ink);border:0;border-radius:4px;padding:12px 16px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--signal);border:1px solid var(--signal)}
.btn.dark{background:#333333;color:#FFFFFF}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;font-size:14px;cursor:pointer;padding:4px 0;text-decoration:underline}
/* picks */
.pick{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--signal);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.pick .num{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.pick h2{margin:2px 0 0;font-size:20px;line-height:1.25;font-weight:700;text-wrap:balance}
.brand{font-weight:700;font-size:15px}
.model{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted)}
.top{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:start}
.sil{width:70px;height:auto}
.pricebox{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:4px;padding:12px}
.pricebox small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.price{font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.price sup{font-size:.48em;vertical-align:top;position:relative;top:.12em;margin:0 1px}
.price.na{font-size:16px;color:var(--muted)}
.eff{font-size:13px;font-weight:700;color:var(--signal);margin-top:4px}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:4px;font-size:15px;line-height:1.35}
.verdict .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.verdict b{display:block}
.verdict.ok{background:var(--good-bg);color:var(--good)}.verdict.ok .ic{background:var(--good)}
.verdict.chk{background:var(--warn-bg);color:var(--warn)}.verdict.chk .ic{background:var(--warn)}
.verdict.no{background:var(--bad-bg);color:var(--bad)}.verdict.no .ic{background:var(--bad)}
.verdict.na{background:var(--sunk);color:var(--muted)}.verdict.na .ic{background:var(--muted)}
.drawings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.drawings{grid-template-columns:1fr}}
.drawing{border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.drawing svg{width:100%;height:auto;max-height:280px;display:block}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px;border-top:1px solid var(--line)}
.dim{display:inline-flex;align-items:center;gap:6px}.dim.strong{color:var(--ink);font-weight:700}.dim.bad{color:var(--bad)}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}.sw.ink{border:2.5px solid var(--ink)}.sw.blue{border:2.5px dashed var(--blue);background:var(--blue-soft)}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:15px}
.facts li{display:flex;flex-direction:column;min-width:0}
.facts small{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.why,.gtk{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15.5px;line-height:1.4}
.why li,.gtk li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.why li::before{content:"✓";color:var(--good);font-weight:800}
.gtk li::before{content:"!";color:var(--warn);font-weight:800;text-align:center}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th[scope=row]{color:var(--muted);font-weight:600;width:110px}
tr:last-child th,tr:last-child td{border-bottom:0}
td.best{background:var(--good-bg);color:var(--good);font-weight:700}
details summary{cursor:pointer;font-weight:700}
dl{margin:6px 0 0}dt{font-weight:700;margin-top:10px}dd{margin:2px 0 0;color:var(--muted);max-width:62ch}
.floor{background:var(--signal-soft);color:var(--signal);border-radius:4px;padding:10px 12px;font-weight:700;font-size:15px}
.disc{font-size:13px;color:var(--muted);margin:0}
.cta{background:#333333;color:#FFFFFF;border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:8px}
.cta b{font-size:19px}.cta p{margin:0;color:#D6D6D6;font-size:15px}
.cta .btn.ghost{background:transparent;color:#FFFFFF;border-color:#FFFFFF}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:4px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
/* measure */
.mfield{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.mfield:first-of-type{border-top:0;padding-top:4px}
.mfield svg{width:96px;height:auto;display:block}
.mfield label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.mfield input,.mfield select,.sel{font:600 18px var(--body);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%;min-width:0;color:var(--ink)}
.mfield p{margin:6px 0 0;font-size:13.5px;color:var(--muted);line-height:1.4}
.mfield .ok{color:var(--good);font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--paper);overflow:hidden}
.stepper button{border:0;background:none;width:46px;height:44px;font-size:22px;cursor:pointer}
.stepper output{flex:1;text-align:center;font:700 19px var(--body);font-variant-numeric:tabular-nums}
.hh{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hh>div{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;min-width:0}
@media (max-width:440px){.hh{grid-template-columns:1fr 1fr}.hh>div:last-child{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:9px 13px;font-size:14.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--signal-soft);border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal);font-weight:700}
.fracs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.fracs button{border:1px solid var(--line);background:var(--card);border-radius:4px;min-width:38px;height:34px;font-size:16px;font-weight:600;cursor:pointer}
.tipbox{background:var(--blue-soft);border-radius:4px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.tipbox b{color:var(--blue)}
/* find */
.filters{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.frow::-webkit-scrollbar{display:none}
.frow .chip{flex:none;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
.fgrid .sel{font-size:15px;padding:9px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;grid-template-columns:56px 1fr;gap:12px}
.item .sil{width:56px}
.item .meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.item .ttl{margin:0;font-size:15px;line-height:1.3;font-weight:600}
.item .price{font-size:24px}
.item .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:2px}
.item .add{background:var(--signal);color:var(--signal-ink);border:0;border-radius:4px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.item .add.on{background:var(--good-bg);color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333333;color:#FFFFFF;padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
</style>

<header><div class="gut">
  <span class="kick">Your fridge shortlist</span>
  <h1 id="h1">Your fridge plan</h1>
  <p id="by"></p>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="gut" role="tablist">
  <button role="tab" data-t="picks" aria-selected="true">Your picks<span class="ct" id="pickCt" hidden></span></button>
  <button role="tab" data-t="measure" aria-selected="false">Measure</button>
  <button role="tab" data-t="find" aria-selected="false">Find more</button>
</div></nav>
<main class="gut" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
const RAW=`__CATALOG__`;
__SHARED__
const STORE="Home Depot Cumberland, 2450 Cumberland Pkwy SE, Atlanta";
const MAXP=3;
const HL={c:["cook","Cooks most nights"],b:["bulk","Buys in bulk"],o:["host","Hosts a lot"],d:["dispenser","Wants ice/water in the door"],f:["flush","Wants a flush, built-in look"],r:["reliable","Last fridge died early"],g:["garage","Going in the garage"]};
const MK={ow:"w",oh:"h",cab:"c",island:"i",hinge:"g",door:"d"};
const st={floor:[],ids:[],sp:{ow:null,oh:null,cab:null,island:null,hinge:null,door:null,path:"straight",water:"unsure"},adults:2,kids:0,habits:{},budget:null,name:""};
let tab="picks",lim=20;const F={style:"all",ice:false,counter:false,brand:"",max:"",sort:"best",fits:true,size:true};
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1900);}

/* ---------- link <-> state ---------- */
function decode(h){h=(h||"").replace(/^#/,"");const t=h.split("-");if(t[0]!=="q1")return false;
 st.ids=[];st.habits={};
 for(const x of t.slice(1)){if(/^\d{9}$/.test(x)){if(!st.ids.includes(x))st.ids.push(x);continue}
  const k=x[0],v=x.slice(1);
  const mk=Object.keys(MK).find(m=>MK[m]===k);
  if(mk&&/^\d+$/.test(v))st.sp[mk]=+v/100;
  else if(k==="p")st.sp.path={s:"straight",t:"turn",x:"stairs"}[v]||"straight";
  else if(k==="r")st.sp.water={y:"yes",n:"no",u:"unsure"}[v]||"unsure";
  else if(k==="a")st.adults=Math.max(1,+v||2);else if(k==="k")st.kids=Math.max(0,+v||0);
  else if(k==="b"&&/^\d+$/.test(v))st.budget=+v;
  else if(k==="f")[...v].forEach(c=>{if(HL[c])st.habits[HL[c][0]]=true});
  else if(k==="n")st.name=v.replace(/[^A-Za-z]/g,"").slice(0,20);
  else if(k==="o")st.floorIdx=[...v].map(Number);}
 if(st.floorIdx){st.floor=st.floorIdx.map(i=>st.ids[i-1]).filter(Boolean);delete st.floorIdx;}
 st.ids=st.ids.filter(id=>CAT.some(u=>u.id===id)).slice(0,MAXP);return true;}
function encode(){const t=["q1",...st.ids];for(const k in MK)if(st.sp[k]!=null)t.push(MK[k]+Math.round(st.sp[k]*100));
 t.push("p"+({straight:"s",turn:"t",stairs:"x"}[st.sp.path]||"s"),"r"+({yes:"y",no:"n",unsure:"u"}[st.sp.water]||"u"),"a"+st.adults,"k"+st.kids);
 if(st.budget)t.push("b"+Math.round(st.budget));
 const hb=Object.entries(HL).filter(([,v])=>st.habits[v[0]]).map(([c])=>c).join("");if(hb)t.push("f"+hb);
 const fl=st.ids.map((id,i)=>st.floor.includes(id)?i+1:"").join("");if(fl)t.push("o"+fl);
 if(st.name)t.push("n"+st.name.toLowerCase());return t.join("-");}
function save(){const h="#"+encode();try{history.replaceState(null,"",h)}catch(e){}try{localStorage.setItem("fp_state",h)}catch(e){}}
function sync(){S.adults=st.adults;S.kids=st.kids;S.habits=st.habits;}

/* ---------- shared bits ---------- */
const nm=()=>st.name?st.name[0].toUpperCase()+st.name.slice(1).toLowerCase():"";
const measured=()=>Object.keys(MK).some(k=>st.sp[k]!=null);
const picks=()=>st.ids.map(id=>CAT.find(u=>u.id===id)).filter(Boolean);
const fitTag=v=>`<span class="tag ${v==="ok"?"fit":v==="chk"?"chk":v==="no"?"no":""}">${{ok:"Fits your kitchen",chk:"Fits, with a note",no:"Won't fit",na:"Fit not checked"}[v]}</span>`;
function togglePick(id){const i=st.ids.indexOf(id);if(i>=0){st.ids.splice(i,1);toast("Removed from your picks")}
 else{if(st.ids.length>=MAXP){toast(`Your list holds ${MAXP}. Remove one first`);return}st.ids.push(id);toast("Added to your picks")}save();render();}
function copyLink(){const url=location.href;
 (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link copied. Text it to yourself or to us")).catch(()=>toast("Press and hold the address bar to copy the link"));}

/* ---------- PICKS ---------- */
function renderPicks(){const us=picks(),sp=st.sp,n=needs();
 if(!us.length)return `<div class="empty"><b>No fridges on your list yet.</b><span>${measured()?"Your measurements are saved. See which fridges fit.":"Start by measuring your space, then pick up to 3 fridges that fit."}</span><div class="row" style="justify-content:center">${measured()?"":`<button class="btn" data-go="measure">Measure my kitchen</button>`}<button class="btn ${measured()?"":"ghost"}" data-go="find">Find fridges</button></div></div>`+ctaHTML();
 const k=[];if(sp.ow)k.push(`Opening ${inch(sp.ow)} wide`);if(sp.oh)k.push(`${inch(sp.oh)} tall`);if(sp.cab)k.push(`Counters ${inch(sp.cab)} deep`);if(sp.island)k.push(`${inch(sp.island)} to the island`);if(sp.hinge!=null)k.push(`${inch(sp.hinge)} beside the hinge`);if(sp.door)k.push(`Doorway ${inch(sp.door)}`);
 const hab=Object.values(HL).filter(([key])=>st.habits[key]).map(x=>x[1]);
 let html=`<section class="panel"><p class="eyebrow">What we matched on</p><div class="tags"><span class="tag">${n.people} ${n.people===1?"person":"people"} · ${n.lo}–${n.hi} cu ft</span>${st.budget?`<span class="tag">Under ${fmt(st.budget)}</span>`:""}${hab.map(x=>`<span class="tag">${x}</span>`).join("")}${k.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
  ${measured()?`<button class="linkbtn" data-go="measure" style="align-self:flex-start">Change measurements or answers</button>`:`<div class="tipbox"><b>Didn't measure yet?</b>Fit can't be checked until you do. It takes about 5 minutes with a tape measure.<button class="btn" data-go="measure" style="align-self:flex-start;margin-top:6px">Measure my kitchen</button></div>`}</section>`;
 us.forEach((u,i)=>{const f=fit(u,sp),p=promo(u);
  const g=gtkList(u,f,sp).map(x=>x.replace(/^Ask if there's a water line behind the old fridge$/,"Check that there's a water line behind your current fridge").replace(/ Look at zero-clearance models$/," Zero-clearance models avoid this (search them in Find more)."));
  html+=`<article class="pick">
   <div class="top">${miniSil(u)}<div><div class="num">Option ${i+1} of ${us.length}</div><div class="brand">${u.brand}</div><h2>${shortLabel(u)}</h2><div class="model">Model ${u.model}</div></div></div>
   ${st.floor.includes(u.id)?`<div class="floor">See it in person: this one is on display at the Cumberland store.</div>`:""}
   ${verdictHTML(f).replace("Add your measurements to check","Measure your kitchen to check")}
   ${(sp.ow||sp.island||sp.hinge!=null)?`<div class="drawings"><div class="drawing"><span class="cap">Front · in your opening</span>${frontDrawing(u,sp)}${frontLegend(u,sp)}</div><div class="drawing"><span class="cap">From above · door swing</span>${planDrawing(u,sp)}${planLegend(u,sp)}</div></div>`:""}
   <ul class="facts"><li><small>Room for</small>${people(u)}</li><li><small>Inside</small>${u.cap} cu ft</li><li><small>Style</small>${STYLE[u.type]}${u.counter?", counter depth":""}</li><li><small>Owners rate it</small>${u.reviews?`★ ${u.rating.toFixed(1)} (${u.reviews.toLocaleString()})`:"No reviews yet"}</li><li><small>Size</small>${inch(u.w)} W × ${inch(u.h)} H × ${inch(u.d)} D</li><li><small>Ice & water</small>${u.disp==="None"?"None in the door":u.disp==="Both"?"Ice and water":u.disp}</li></ul>
   <h3>Why this one</h3><ul class="why">${(whyList(u,us).map(x=>`<li>${x}</li>`).join(""))||"<li>Solid all-around pick in your size</li>"}</ul>
   ${g.length?`<h3>Good to know</h3><ul class="gtk">${g.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
   <div class="pricebox"><div><small>Price on ${DATA_DATE.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</small>${priceHTML(u.price)}${p&&p.save?`<div class="eff">${fmt(p.eff)} with the current promotion</div>`:""}</div>
    <a class="btn" href="https://www.homedepot.com/p/${u.id}" rel="noopener">See today's price</a></div>
   <button class="linkbtn" data-rm="${u.id}" style="align-self:flex-start">Remove from my picks</button>
  </article>`;});
 if(us.length>1){const R=(label,fn,best)=>{let bi=-1;if(best){const v=us.map(best),t=Math.min(...v);if(isFinite(t)&&v.filter(x=>x===t).length===1)bi=v.indexOf(t)}return `<tr><th scope="row">${label}</th>${us.map((u,i)=>`<td class="${i===bi?"best":""}">${fn(u)}</td>`).join("")}</tr>`};
  html+=`<section class="panel"><p class="eyebrow">Side by side</p><div class="tablewrap"><table><thead><tr><th scope="row"></th>${us.map((u,i)=>`<th>Option ${i+1}<div class="model">${u.brand}</div></th>`).join("")}</tr></thead><tbody>
   ${R("Price",u=>fmt(u.price),u=>u.price??Infinity)}${R("Inside",u=>u.cap+" cu ft",u=>-u.cap)}${R("$ per cu ft",u=>"$"+Math.round(effPrice(u)/u.cap),u=>effPrice(u)/u.cap)}
   ${R("Fit",u=>({ok:"Fits",chk:"Fits, with a note",no:"Won't fit",na:"Not checked"})[fit(u,sp).verdict])}
   ${R("Width",u=>inch(u.w),null)}${R("Doors open",u=>inch(u.d90)+" from wall",u=>u.d90||99)}${R("Ice & water",u=>u.disp)}
   ${R("Rating",u=>u.reviews?`★ ${u.rating.toFixed(1)}`:"–",u=>-BAYES(u))}${R("Returns",u=>u.returnable?"90 days":"Issues covered 2 days after delivery")}</tbody></table></div><p class="note">Green marks the best in each row.</p></section>`;}
 html+=`<p class="disc">Fit check is a guide based on the measurements you entered. Confirm with the model’s installation guide before buying.</p>`;
 if(us.length<MAXP)html+=`<button class="btn ghost" data-go="find">Add another fridge to compare</button>`;
 return html+ctaHTML()+glossHTML();}
function ctaHTML(){return `<section class="cta"><b>Ready to buy, or have questions?</b><p>Come back and ask for ${nm()||"the appliance team"} in Appliances at ${STORE}. Show this page and we'll pick up right where you left off. Your list and measurements are saved on this phone and in this page's link.</p><div class="row"><button class="btn ghost" id="copyLink">Copy my link</button></div></section>`;}
function glossHTML(){return `<details class="panel"><summary>What these terms mean</summary><dl>
  <dt>Cubic feet (cu ft)</dt><dd>How much fits inside. A rough rule is 4 to 5 cu ft per person, more if you cook a lot or buy in bulk.</dd>
  <dt>Counter depth</dt><dd>Shallower so it sits closer to flush with your cabinets. Looks built in, but holds less than a standard-depth fridge of the same width.</dd>
  <dt>French door</dt><dd>Two fridge doors on top and a freezer drawer below. Fresh food sits at eye level, and each door needs less room to swing.</dd>
  <dt>Zero-clearance hinges</dt><dd>The doors stay inside the fridge's width when they open, so it can sit right against a wall and the drawers still slide out.</dd>
  <dt>Door swing</dt><dd>How far the doors reach into the room when open. It matters if you have an island or a narrow walkway.</dd>
  <dt>Garage ready</dt><dd>Built to keep food at safe temperatures in a hot or cold garage.</dd>
  <dt>Energy Star</dt><dd>Certified to use less electricity than the federal standard.</dd>
 </dl></details><p class="note">Prices and promotions change. "See today's price" shows the current price on homedepot.com. Nothing about you is sent anywhere; your list lives in this page's link and on this phone.</p>`;}

/* ---------- MEASURE ---------- */
const DIA={
 ow:`<svg viewBox="0 0 96 80"><rect x="2" y="10" width="20" height="66" fill="var(--sunk)" stroke="var(--muted)"/><rect x="74" y="10" width="20" height="66" fill="var(--sunk)" stroke="var(--muted)"/><line x1="22" y1="44" x2="74" y2="44" stroke="var(--signal)" stroke-width="3"/><path d="M22 44l7-5v10zM74 44l-7-5v10z" fill="var(--signal)"/><line x1="0" y1="76" x2="96" y2="76" stroke="var(--muted)"/></svg>`,
 oh:`<svg viewBox="0 0 96 80"><rect x="14" y="2" width="68" height="14" fill="var(--sunk)" stroke="var(--muted)"/><line x1="48" y1="16" x2="48" y2="76" stroke="var(--signal)" stroke-width="3"/><path d="M48 16l-5 7h10zM48 76l-5-7h10z" fill="var(--signal)"/><line x1="0" y1="76" x2="96" y2="76" stroke="var(--muted)"/></svg>`,
 cab:`<svg viewBox="0 0 96 80"><rect x="2" y="4" width="8" height="72" fill="var(--muted)" opacity=".5"/><rect x="10" y="40" width="62" height="36" fill="var(--sunk)" stroke="var(--muted)"/><rect x="10" y="36" width="66" height="5" fill="var(--muted)"/><line x1="10" y1="26" x2="76" y2="26" stroke="var(--signal)" stroke-width="3"/><path d="M10 26l7-5v10zM76 26l-7-5v10z" fill="var(--signal)"/></svg>`,
 island:`<svg viewBox="0 0 96 80"><rect x="2" y="2" width="92" height="8" fill="var(--muted)" opacity=".5"/><rect x="26" y="10" width="44" height="22" fill="var(--card)" stroke="var(--ink)"/><rect x="10" y="64" width="76" height="12" fill="var(--sunk)" stroke="var(--muted)"/><line x1="82" y1="10" x2="82" y2="64" stroke="var(--signal)" stroke-width="3"/><path d="M82 10l-5 7h10zM82 64l-5-7h10z" fill="var(--signal)"/></svg>`,
 hinge:`<svg viewBox="0 0 96 80"><rect x="2" y="2" width="10" height="76" fill="var(--muted)" opacity=".5"/><rect x="32" y="8" width="56" height="66" fill="var(--card)" stroke="var(--ink)"/><line x1="12" y1="40" x2="32" y2="40" stroke="var(--signal)" stroke-width="3"/><path d="M12 40l6-5v10zM32 40l-6-5v10z" fill="var(--signal)"/></svg>`,
 door:`<svg viewBox="0 0 96 80"><rect x="2" y="4" width="16" height="72" fill="var(--sunk)" stroke="var(--muted)"/><rect x="78" y="4" width="16" height="72" fill="var(--sunk)" stroke="var(--muted)"/><path d="M18 4h60" stroke="var(--muted)"/><line x1="18" y1="50" x2="78" y2="50" stroke="var(--signal)" stroke-width="3"/><path d="M18 50l7-5v10zM78 50l-7-5v10z" fill="var(--signal)"/></svg>`};
const MF=[
 ["ow","Width of the space","Wall to wall, or cabinet to cabinet, where the fridge goes. Measure at the top, middle and bottom and use the smallest."],
 ["oh","Height of the space","Floor to the bottom of the cabinet above. If there's no cabinet, leave this blank."],
 ["cab","Counter depth","Back wall to the front edge of the counter. Usually about 24 to 25 inches. This shows how far the fridge will stick out."],
 ["island","Back wall to island","Back wall to the island or the counter across from the fridge. Leave blank if it's open. This checks the doors can open all the way."],
 ["hinge","Space beside the hinge side","Only if the fridge sits next to a wall or tall pantry: the gap from that wall to where the fridge's side will be. Leave blank if that side is open."],
 ["door","Narrowest doorway on the way in","Front door, hallways and the kitchen doorway. Measure the narrowest one, inside the door frame with the door open."]];
function renderMeasure(){const sp=st.sp;
 return `<section class="panel"><h2 class="sec">Measure your kitchen</h2><p class="lede">Grab a tape measure. Everything updates as you type, and it's all saved on this phone. Fractions work: type 35 3/4 or tap a fraction.</p>
  <div class="tipbox"><b>Measure the space, not your old fridge.</b>Your new fridge needs to fit the opening, the doorways, and room for the doors to open.</div></section>
 <section class="panel"><p class="eyebrow">Who it's for</p>
  <div class="hh"><div>Adults<div class="stepper"><button data-step="adults" data-d="-1" aria-label="Fewer adults">−</button><output>${st.adults}</output><button data-step="adults" data-d="1" aria-label="More adults">+</button></div></div>
   <div>Kids<div class="stepper"><button data-step="kids" data-d="-1" aria-label="Fewer kids">−</button><output>${st.kids}</output><button data-step="kids" data-d="1" aria-label="More kids">+</button></div></div>
   <div><label for="m-budget" style="font-weight:700">Budget</label><input class="sel" id="m-budget" inputmode="numeric" placeholder="No limit" value="${st.budget??""}"></div></div>
  <div class="chips">${Object.values(HL).map(([k,l])=>`<button class="chip" data-hab="${k}" aria-pressed="${!!st.habits[k]}">${l}</button>`).join("")}</div>
  <p class="note" id="sizeNote">Right size for you: ${needs().lo}–${needs().hi} cu ft</p></section>
 <section class="panel"><p class="eyebrow">Your space · inches</p>
  ${MF.map(([k,l,h])=>`<div class="mfield">${DIA[k]}<div><label>${l}<input class="meas" id="m-${k}" data-k="${k}" inputmode="decimal" autocomplete="off" placeholder="${k==="ow"?"e.g. 36":k==="oh"?"e.g. 70 1/2":k==="cab"?"e.g. 25":"leave blank if open"}" value="${sp[k]!=null?showIn(sp[k]):""}"></label>
   <div class="fracs" data-for="m-${k}">${["⅛","¼","⅜","½","⅝","¾","⅞"].map((f,i)=>`<button data-frac="${(i+1)/8}" aria-label="Add ${f}">${f}</button>`).join("")}</div><p>${h}</p></div></div>`).join("")}
  <div class="mfield"><div></div><div><label>Getting it inside<select id="m-path"><option value="straight"${sp.path==="straight"?" selected":""}>Straight shot to the kitchen</option><option value="turn"${sp.path==="turn"?" selected":""}>Tight turn on the way</option><option value="stairs"${sp.path==="stairs"?" selected":""}>Stairs on the way</option></select></label></div></div>
  <div class="mfield"><div></div><div><label>Is there a water line behind the fridge?<select id="m-water"><option value="unsure"${sp.water==="unsure"?" selected":""}>Not sure</option><option value="yes"${sp.water==="yes"?" selected":""}>Yes</option><option value="no"${sp.water==="no"?" selected":""}>No</option></select></label><p>Look behind your current fridge for a thin tube going into the wall. You need one for ice and water in the door.</p></div></div>
 </section>
 <div class="row"><button class="btn" data-go="${st.ids.length?"picks":"find"}">${st.ids.length?"Check my picks":"See fridges that fit"}</button>${st.ids.length?`<button class="btn ghost" data-go="find">Find more that fit</button>`:""}</div>`;}
function bindMeasure(){let last=null;
 document.querySelectorAll(".meas").forEach(i=>{i.addEventListener("focus",()=>last=i);
  i.addEventListener("input",()=>{const v=parseIn(i.value);st.sp[i.dataset.k]=v;save();updMeasureNote();});
  i.addEventListener("blur",()=>{const v=parseIn(i.value);if(v!=null)i.value=showIn(v);});});
 document.querySelectorAll(".fracs button").forEach(b=>{b.addEventListener("mousedown",e=>e.preventDefault());b.onclick=()=>{const i=$(b.parentElement.dataset.for);const base=Math.floor(parseIn(i.value)||0);const v=base+ +b.dataset.frac;i.value=showIn(v);st.sp[i.dataset.k]=v;save();};});
 $("m-path").onchange=e=>{st.sp.path=e.target.value;save()};$("m-water").onchange=e=>{st.sp.water=e.target.value;save()};
 $("m-budget").oninput=e=>{const v=parseFloat(String(e.target.value).replace(/[^\d.]/g,""));st.budget=isFinite(v)&&v>0?v:null;save();};
 document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const k=b.dataset.step;st[k]=Math.max(k==="adults"?1:0,Math.min(12,st[k]+ +b.dataset.d));b.parentElement.querySelector("output").textContent=st[k];sync();save();updMeasureNote();});
 document.querySelectorAll("[data-hab]").forEach(c=>c.onclick=()=>{const k=c.dataset.hab;st.habits[k]=!st.habits[k];if(!st.habits[k])delete st.habits[k];c.setAttribute("aria-pressed",!!st.habits[k]);sync();save();updMeasureNote();});}
function updMeasureNote(){const n=needs(),el=$("sizeNote");if(el)el.textContent=`Right size for you: ${n.lo}–${n.hi} cu ft`;}

/* ---------- FIND ---------- */
function score(u,f){const n=needs(),h=st.habits;let s=0;if(f.verdict==="ok")s+=3;if(f.verdict==="chk")s+=1;if(u.cap>=n.lo&&u.cap<=n.hi+4)s+=3;else if(u.cap>=n.lo-2)s+=1;
 s+=BAYES(u)*1.2;if(h.reliable&&u.disp==="None")s+=1.5;if(h.dispenser&&u.disp!=="None")s+=1.5;if(h.flush&&u.counter)s+=2;if(h.garage&&u.garage)s+=2;if(st.budget&&effPrice(u)>st.budget)s-=4;
 if(st.sp.ow!=null){const g=st.sp.ow-u.w;if(g>=0&&g<=2)s+=2;else if(g>4)s-=1.5;}if(u.price==null)s-=3;return s;}
function results(){const n=needs(),sp=st.sp,max=parseFloat(F.max)||st.budget||null;
 let r=CAT.map(u=>({u,f:fit(u,sp)}));
 if(F.fits&&measured())r=r.filter(x=>x.f.verdict!=="no");
 if(F.size)r=r.filter(x=>x.u.cap>=n.lo-1&&x.u.cap<=n.hi+6);
 if(F.style!=="all")r=r.filter(x=>x.u.type===F.style);
 if(F.ice)r=r.filter(x=>x.u.disp!=="None");if(F.counter)r=r.filter(x=>x.u.counter);if(st.habits.garage)r=r.filter(x=>x.u.garage);
 if(F.brand)r=r.filter(x=>x.u.brand===F.brand);if(max)r=r.filter(x=>x.u.price!=null&&effPrice(x.u)<=max);
 const P=u=>u.price==null?Infinity:effPrice(u);
 if(F.sort==="price")r.sort((a,b)=>P(a.u)-P(b.u));else if(F.sort==="cap")r.sort((a,b)=>b.u.cap-a.u.cap);else if(F.sort==="rated")r.sort((a,b)=>BAYES(b.u)-BAYES(a.u));else r.sort((a,b)=>score(b.u,b.f)-score(a.u,a.f));
 const seen=new Set();return r.filter(x=>{const k=[x.u.brand,x.u.type,x.u.cap,x.u.w,x.u.price].join("|");if(seen.has(k))return false;seen.add(k);return true;});}
function renderFind(){const n=needs(),r=results(),brands=[...new Set(CAT.map(u=>u.brand))].sort();
 const chip=(k,v,l)=>`<button class="chip" data-f="${k}" data-v="${v}" aria-pressed="${F[k]===v||(v===true&&F[k]===true)}">${l}</button>`;
 return `<section class="panel"><h2 class="sec">Find fridges that fit</h2><p class="lede">${measured()?"Showing fridges that fit the measurements you entered.":"You haven't measured yet, so fit isn't checked. <button class=\"linkbtn\" data-go=\"measure\">Measure first</button>"} Sized for ${n.people} ${n.people===1?"person":"people"} (${n.lo}–${n.hi} cu ft).</p>
  <div class="filters">
   <div class="frow">${chip("style","all","All styles")}${chip("style","FD","French door")}${chip("style","SS","Side by side")}${chip("style","BF","Bottom freezer")}${chip("style","TF","Top freezer")}</div>
   <div class="frow"><button class="chip" data-tg="fits" aria-pressed="${F.fits&&measured()}" ${measured()?"":"disabled"}>Fits my space</button><button class="chip" data-tg="size" aria-pressed="${F.size}">Right size for us</button><button class="chip" data-tg="ice" aria-pressed="${F.ice}">Ice & water in door</button><button class="chip" data-tg="counter" aria-pressed="${F.counter}">Counter depth</button></div>
   <div class="fgrid"><label>Brand<select class="sel" id="f-brand"><option value="">Any brand</option>${brands.map(b=>`<option${F.brand===b?" selected":""}>${b}</option>`).join("")}</select></label>
    <label>Max price<input class="sel" id="f-max" inputmode="numeric" placeholder="${st.budget?fmt(st.budget):"No limit"}" value="${F.max}"></label>
    <label style="grid-column:1/-1">Sort by<select class="sel" id="f-sort"><option value="best"${F.sort==="best"?" selected":""}>Best match for us</option><option value="price"${F.sort==="price"?" selected":""}>Lowest price</option><option value="cap"${F.sort==="cap"?" selected":""}>Most space</option><option value="rated"${F.sort==="rated"?" selected":""}>Top rated</option></select></label></div>
  </div><p class="disc">Prices come from homedepot.com and are updated every Sunday. Fit check is a guide based on the measurements you entered. Confirm with the model’s installation guide before buying.</p></section>
  <p class="note" aria-live="polite">${r.length} fridge${r.length===1?"":"s"} · ${st.ids.length} of ${MAXP} on your list · prices as of ${DATA_DATE.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</p>
  <div class="list">${r.length?r.slice(0,lim).map(({u,f})=>{const p=promo(u),on=st.ids.includes(u.id);
   return `<article class="item">${miniSil(u)}<div class="meta"><div class="brand">${u.brand}</div><p class="ttl">${shortLabel(u)}</p>
    <div class="row" style="gap:8px">${priceHTML(u.price)}${p&&p.save?`<span class="eff" style="margin:0">${fmt(p.eff)} with promo</span>`:""}</div>
    <div class="sub">${u.cap} cu ft · ${inch(u.w)} wide · ${STYLE[u.type]}${u.reviews?` · ★ ${u.rating.toFixed(1)} (${u.reviews.toLocaleString()})`:""}</div>
    <div class="tags">${fitTag(measured()?f.verdict:"na")}${u.disp!=="None"?`<span class="tag">${u.disp==="Both"?"Ice + water":u.disp}</span>`:""}${u.zero?`<span class="tag fit">Zero clearance</span>`:""}</div>
    <div class="acts"><button class="add ${on?"on":""}" data-pick="${u.id}">${on?"✓ On my list":"Add to my list"}</button><a class="linkbtn" href="https://www.homedepot.com/p/${u.id}" rel="noopener">Today's price</a></div></div></article>`}).join("")+(r.length>lim?`<button class="btn ghost" id="more">Show more (${r.length-lim} left)</button>`:""):`<div class="empty">Nothing matches. Turn off a filter above${measured()?", or double-check your measurements":""}.</div>`}</div>`;}
function bindFind(){document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F[b.dataset.f]=b.dataset.v;lim=20;render();});
 document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{F[b.dataset.tg]=!F[b.dataset.tg];lim=20;render();});
 $("f-brand").onchange=e=>{F.brand=e.target.value;lim=20;render();};$("f-sort").onchange=e=>{F.sort=e.target.value;render();};
 $("f-max").onchange=e=>{F.max=String(e.target.value).replace(/[^\d.]/g,"");lim=20;render();};
 if($("more"))$("more").onclick=()=>{lim+=20;const y=scrollY;render();scrollTo(0,y);};}

/* ---------- shell ---------- */
function render(){sync();const n=st.ids.length;$("pickCt").hidden=!n;$("pickCt").textContent=n;
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));
 $("by").textContent=`${nm()?`Prepared with ${nm()}, appliance associate`:"Your fridge planner"} · prices as of ${DATA_DATE.toLocaleDateString("en-US",{month:"long",day:"numeric"})}`;
 $("h1").textContent=tab==="measure"?"Measure your kitchen":tab==="find"?"Find more fridges":n?`Your ${n} fridge pick${n>1?"s":""}`:"Your fridge plan";
 $("main").innerHTML=tab==="measure"?renderMeasure():tab==="find"?renderFind():renderPicks();
 if(tab==="measure")bindMeasure();if(tab==="find")bindFind();
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>togglePick(b.dataset.rm));
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const y=scrollY;togglePick(b.dataset.pick);scrollTo(0,y);});
 if($("copyLink"))$("copyLink").onclick=copyLink;}
function go(t){tab=t;render();scrollTo(0,0);}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function boot(){let ok=decode(location.hash);if(!ok){try{const h=localStorage.getItem("fp_state");if(h)ok=decode(h)}catch(e){}}
 tab=st.ids.length?"picks":"measure";save();render();}
window.addEventListener("hashchange",()=>{if(location.hash!=="#"+encode()){decode(location.hash);tab=st.ids.length?"picks":tab;render();}});
boot();
</script>
